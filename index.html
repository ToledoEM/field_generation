<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lines Flow Field</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-color: #0057ba;
            --accent-color-hover: #0057ba;
            --text-color: #212529;
            --bg-color: #fafafa;
            --secondary-color: #70767b;
            --secondary-color-hover: #5a6268;
        }

        body {
            margin: 0;
            display: flex;
            min-height: 100vh;
            background-color: var(--bg-color);
            font-family: 'Inter', Arial, sans-serif;
            overflow: hidden;
            color: var(--text-color);
        }

        #sidebar {
            width: 300px;
            height: 100vh;
            background: white;
            box-shadow: 4px 0 15px rgba(0, 0, 0, 0.05);
            overflow-y: auto;
            transition: margin-left 0.3s ease;
            position: relative;
            z-index: 10;
        }
        #sidebar.hidden {
            margin-left: -300px;
        }
        #controls {
            padding: 25px 20px 20px 20px;
        }

        #toggleBtn {
            position: fixed;
            left: 300px;
            top: 20px;
            width: 40px;
            height: 40px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
            z-index: 11;
            transition: left 0.3s ease, background 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
        }

        #toggleBtn.hidden {
            left: 0;
            background: var(--text-color);
        }
        #toggleBtn:hover {
            background: var(--accent-color-hover);
        }
        #toggleBtn.hidden:hover {
            background: var(--secondary-color-hover);
        }

        #canvasContainer {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative; /* Crucial for positioning the overlay */
        }

        /* UPDATED PROGRESS BAR STYLES */
        #progressOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.6);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease-in-out;
            z-index: 5;
        }
        #progressOverlay.visible {
            opacity: 1;
            pointer-events: auto;
        }
        #progressBarContainer {
            width: 60%;
            max-width: 300px;
            background-color: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2); /* Slightly darker shadow for visibility */
        }
        #progressBar {
            position: relative;
            height: 20px;
            width: 100%;
            background-color: transparent;
            text-align: center;
            line-height: 20px;
            color: white;
            font-size: 12px;
            font-weight: 500;
            overflow: hidden;
        }
        #progressBar::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: var(--progress-width, 0%);
            height: 100%;
            background-color: var(--accent-color);
            transition: width 0.2s ease-out;
            z-index: -1;
        }
        #cancelBtn {
            margin-top: 15px;
            padding: 8px 20px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;
        }
        #cancelBtn:hover {
            background: #c82333;
        }
        /* END UPDATED PROGRESS BAR STYLES */

        h2 {
            margin: 0 0 20px 0;
            font-size: 20px;
            font-weight: 600;
            color: var(--text-color);
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 8px;
        }

        .control-group {
            margin-bottom: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
        #controls > .control-group:first-of-type {
            border-top: none;
            padding-top: 0;
        }

        .control-group label {
            font-weight: 500;
            font-size: 14px;
            color: var(--text-color);
            margin-bottom: 8px;
        }

        .value-display {
            min-width: 50px;
            text-align: right;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-color);
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f8f9fa;
            padding: 8px 10px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }

        input[type="range"] {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: #ddd;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb,
        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
        }

        #seedInput {
            flex: 1;
            padding: 8px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            margin-top: 5px;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 25px;
        }

        button {
            width: 100%;
            padding: 12px 20px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;
        }
        button:hover {
            background: var(--accent-color-hover);
        }

        .control-group button {
            background: #495057;
            padding: 8px 16px;
            margin-top: 10px;
        }
        .control-group button:hover {
            background: #495057;
        }

        .button-group button:nth-child(2),
        .button-group button:nth-child(3),
        .button-group button:nth-child(4) {
            background: var(--secondary-color);
            font-weight: 500;
            padding: 10px 20px;
        }
        .button-group button:nth-child(2):hover,
        .button-group button:nth-child(3):hover,
        .button-group button:nth-child(4):hover {
            background: var(--secondary-color-hover);
        }

        .info-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #929598;
            border: 1px solid #ffffff;
            border-radius: 4px;
            font-size: 12px;
            color: #495057;
            line-height: 1.5;
            text-align: center;
        }
    </style>
</head>
<body>
    <button id="toggleBtn" onclick="toggleSidebar()">◀</button>

    <div id="sidebar">
        <div id="controls">
            <h2>Flow Field Controls</h2>

            <div class="control-group" style="border-top: none; padding-top: 0;">
                <div style="display: flex; justify-content: space-between;">
                    <label for="aspectRatioSelect">Canvas Aspect Ratio</label>
                    <span class="value-display" id="aspectRatioValue">800x800</span>
                </div>
                <div class="slider-container" style="background:#f0f1f2;">
                    <select id="aspectRatioSelect" style="flex:1; padding:6px 8px; border:1px solid #ced4da; border-radius:4px; font-size:13px; font-family:'Inter',sans-serif; background:white;">
                        </select>
                </div>
            </div>

            <div class="control-group">
                <div style="display: flex; justify-content: space-between; align-items:center;">
                    <label for="fieldMethod">Field Method</label>
                    <span class="value-display" id="fieldMethodLabel">Quantized Perlin</span>
                </div>
                <div class="slider-container" style="background:#f0f1f2;">
                    <select id="fieldMethod" style="flex:1; padding:6px 8px; border:1px solid #ced4da; border-radius:4px; font-size:13px; font-family:'Inter',sans-serif; background:white;">
                        </select>
                </div>
            </div>

            <div class="control-group">
                <div style="display: flex; justify-content: space-between;">
                    <label for="fieldScale">Field Scale</label>
                    <span class="value-display" id="fieldScaleValue">0.005</span>
                </div>
                <div class="slider-container">
                    <input type="range" id="fieldScale" min="0.001" max="0.05" step="0.001" value="0.005">
                </div>
            </div>

            <div class="control-group">
                <div style="display: flex; justify-content: space-between;">
                    <label for="resolution">Resolution</label>
                    <span class="value-display" id="resolutionValue">30</span>
                </div>
                <div class="slider-container">
                    <input type="range" id="resolution" min="10" max="100" step="5" value="30">
                </div>
            </div>

            <div class="control-group">
                <div style="display: flex; justify-content: space-between;">
                    <label for="numPaths">Number of Paths</label>
                    <span class="value-display" id="numPathsValue">500</span>
                </div>
                <div class="slider-container">
                    <input type="range" id="numPaths" min="100" max="10000" step="50" value="500">
                </div>
            </div>

            <div class="control-group">
                <div style="display: flex; justify-content: space-between;">
                    <label for="stepSize">Step Size</label>
                    <span class="value-display" id="stepSizeValue">4.0</span>
                </div>
                <div class="slider-container">
                    <input type="range" id="stepSize" min="1" max="20" step="0.5" value="4">
                </div>
            </div>

            <div class="control-group">
                <div style="display: flex; justify-content: space-between;">
                    <label for="strokeWeight">Stroke Weight</label>
                    <span class="value-display" id="strokeWeightValue">0.5</span>
                </div>
                <div class="slider-container">
                    <input type="range" id="strokeWeight" min="0.1" max="3" step="0.1" value="0.5">
                </div>
            </div>

            <div class="control-group">
                <div style="display: flex; justify-content: space-between;">
                    <label for="seedInput">Seed</label>
                    <span class="value-display" id="seedValue">Random</span>
                </div>
                <input type="number" id="seedInput" placeholder="Enter seed">
                <button onclick="randomizeSeed()">Random Seed</button>
            </div>

            <div class="button-group">
                <button onclick="regenerate()">Regenerate</button>
                <button onclick="downloadSVG()">Download SVG</button>
                <button onclick="downloadCSV()">Download CSV</button>
                <button onclick="downloadJSON()">Download JSON</button>
            </div>

            <div class="info-box">
                <div>Created by ToledoEM</div>
                MIT License</div>
            </div>

        </div>
    </div>

    <div id="canvasContainer">
        <div id="progressOverlay">
            <div id="progressBarContainer">
                <div id="progressBar">0%</div>
            </div>
            <button id="cancelBtn" onclick="cancelGeneration()">Cancel</button>
        </div>
        </div>
    <div id="methodPanel" style="position:fixed; right:0; top:0; width:280px; height:100vh; background:#ffffff; box-shadow:-4px 0 15px rgba(0,0,0,0.05); padding:20px 18px 30px 18px; overflow-y:auto; font-family:'Inter',sans-serif;">
        <h2 style="border-bottom:2px solid var(--accent-color); padding-bottom:8px; margin-top:0; font-size:18px;">Method Params</h2>
        <div id="dynamicParams" style="display:flex; flex-direction:column; gap:16px;"></div>
        <div style="margin-top:24px; border-top:1px solid #eee; padding-top:16px; display:flex; flex-direction:column; gap:10px;">
            <label style="display:flex; align-items:center; gap:8px; font-size:13px; font-weight:500;">
                <input type="checkbox" id="autoRegenerate" style="transform:scale(1.2);" />
                Auto Regenerate on Change
            </label>
            <button id="forceRegenerateBtn" onclick="regenerate()" style="background:var(--accent-color);">Force Regenerate (R)</button>
            <small style="color:#555; line-height:1.4;">Press <strong>R</strong> anytime to regenerate. Enable auto mode to update continuously when parameters or sliders change.</small>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.1/p5.min.js"></script>
    <script src="field-methods.js"></script>
    <script src="flowfields.js"></script>
</body>
</html>
